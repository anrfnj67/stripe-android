# Supplemental evidence run for bug bounty report #4119714:
# runtime logcat proof that the cross-origin frame actually receives the
# client secret and that onSuccess forgery reaches the production handler.
# Branch-only: does not touch the frozen poc/challenge-bridge workflow.
name: poc-challenge-bridge-runtime-evidence

on:
  workflow_dispatch:
  push:
    branches: [poc/challenge-bridge-runtime-evidence]

jobs:
  runtime-evidence:
    name: Runtime exfil evidence (real WebView / emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented PoC + runtime logcat capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            bash -eo pipefail -c 'set -e
            ./gradlew :payments-core:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.stripe.android.challenge.confirmation.IntentConfirmationChallengeRealWebViewPoCTest | tee instrumented_poc.log
            adb logcat -d -s RUNTIME-EVIDENCE:I | tee runtime_evidence.log
            grep -q "STOLEN initParams" runtime_evidence.log
            grep -q "clientSecret" runtime_evidence.log
            grep -q "FORGED onSuccess" runtime_evidence.log'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence
          path: |
            instrumented_poc.log
            runtime_evidence.log
          if-no-files-found: warn
