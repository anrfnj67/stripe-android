# PoC runner for bug bounty report /reports/4119714
# (intent-confirmation-challenge WebView bridge exposes client secret
#  without origin validation, stripe-android @ 363bcfa890de)
#
# Job 1: Robolectric unit PoC  -> fresh JUnit XML (wiring-level evidence)
# Job 2: REAL WebView instrumented PoC on an Android emulator - a
#        cross-origin iframe's own JavaScript calls Android.getInitParams()
#        and Android.onSuccess() against the production bridge.
name: poc-challenge-bridge

on:
  workflow_dispatch:
  push:
    branches: [poc/challenge-bridge]

jobs:
  poc:
    name: Bridge PoC (unit + real WebView)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Unit PoC (Robolectric) - fresh JUnit XML
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :payments-core:testDebugUnitTest \
            --tests "com.stripe.android.challenge.confirmation.IntentConfirmationChallengeBridgeSecurityPoCTest" \
            | tee unit_poc.log

      - name: Real-WebView PoC on emulator (cross-origin iframe JS)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash -eo pipefail -c './gradlew :payments-core:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.stripe.android.challenge.confirmation.IntentConfirmationChallengeRealWebViewPoCTest | tee instrumented_poc.log'

      - name: Evidence gate
        shell: bash
        run: |
          set -euo pipefail
          echo "--- unit gate ---"
          grep -E "IntentConfirmationChallengeBridgeSecurityPoCTest.*(PASSED|passed)|tests completed" unit_poc.log || true
          test -n "$(find payments-core/build/test-results -name '*.xml' -path '*testDebugUnitTest*' 2>/dev/null)"
          echo "--- instrumented gate ---"
          grep -E "crossOriginIframeJavaScriptReceivesClientSecretAndForgesSuccess.*(PASSED|passed)|tests completed" instrumented_poc.log || true
          XML=$(find payments-core/build/outputs/androidTest-results -name '*.xml' 2>/dev/null | head -1)
          test -n "$XML"
          grep -q "failures=\"0\"" "$XML"
          grep -q "crossOriginIframeJavaScriptReceivesClientSecretAndForgesSuccess" "$XML"

      - name: Upload evidence (logs + JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-evidence
          path: |
            unit_poc.log
            instrumented_poc.log
            payments-core/build/test-results/**/*.xml
            payments-core/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: warn
