# PoC runner for the stripe-android fix-gap finding:
# commit 1be3556 ("Sanitize payment authentication intent URLs", PR #14843)
# hardened only the intent:// branch of PaymentAuthWebViewClient
# (component=null, selector=null, +CATEGORY_BROWSABLE). The custom-scheme
# branch ~16 lines above it in the same function still launches a bare
# implicit ACTION_VIEW with no browsable category and no scheme allowlist.
#
# Job 1: Robolectric differential PoC - the same deep-link target via
#        custom-scheme vs intent:// : browsable enforced on one branch only.
# Job 2: REAL WebView + REAL intent resolution on an Android emulator -
#        a page in the payment-auth WebView navigates to pocnb://... and a
#        registered NON-browsable handler is launched; the intent:// form of
#        the same target cannot reach it (the fix's own property).
name: poc-webview-scheme-fix-gap

on:
  workflow_dispatch:
  push:
    branches: [poc/webview-scheme-fix-gap]

jobs:
  poc:
    name: Fix-gap PoC (unit differential + real WebView/emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Unit differential PoC (Robolectric) - fresh JUnit XML
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :payments-core:testDebugUnitTest \
            --tests "com.stripe.android.view.PaymentAuthWebViewSchemeFixGapPoCTest" \
            | tee unit_poc.log

      - name: Real-WebView + real intent resolution PoC on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash -eo pipefail -c './gradlew :payments-core:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.stripe.android.view.PaymentAuthWebViewSchemeFixGapRealWebViewPoCTest | tee instrumented_poc.log'

      - name: Evidence gate
        shell: bash
        run: |
          set -euo pipefail
          echo "--- unit gate ---"
          grep -E "PaymentAuthWebViewSchemeFixGapPoCTest.*(PASSED|passed)|tests completed" unit_poc.log || true
          XML=$(find payments-core/build/test-results -name '*PaymentAuthWebViewSchemeFixGapPoCTest*.xml' -path '*testDebugUnitTest*' 2>/dev/null | head -1)
          test -n "$XML"
          grep -q "failures=\"0\"" "$XML"
          grep -q "differential_sameDeepLinkTarget_browsableEnforcedOnlyOnIntentSchemeBranch" "$XML"
          grep -q "customSchemeUrl_launchesImplicitViewIntent_withoutBrowsableCategory" "$XML"
          echo "--- instrumented gate ---"
          grep -E "realWebViewPageNavigation.*(PASSED|passed)|tests completed" instrumented_poc.log || true
          IXML=$(find payments-core/build/outputs/androidTest-results -name '*.xml' 2>/dev/null | head -1)
          test -n "$IXML"
          grep -q "failures=\"0\"" "$IXML"
          grep -q "realWebViewPageNavigation_customSchemeLaunchesNonBrowsableHandler" "$IXML"
          grep -q "realWebViewPageNavigation_intentSchemeEquivalent_isBlockedFromNonBrowsableHandler" "$IXML"
          echo "--- PASS markers ---"
          grep "\[PoC\] PASS" instrumented_poc.log

      - name: Upload evidence (logs + JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-evidence
          path: |
            unit_poc.log
            instrumented_poc.log
            payments-core/build/test-results/**/*.xml
            payments-core/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: warn
